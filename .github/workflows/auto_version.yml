name: Auto Versioning and Tagging

on:
  push:
    branches:
      - main # O la rama donde quieras que esto pase

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para leer los tags previos

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bump Version Code and Name
        id: version_bump
        run: |
          # Aquí puedes usar un script simple para editar tu build.gradle.kts o build.gradle
          # Ejemplo: Incrementar versionCode en 1
          sed -i 's/versionCode [0-9]*/versionCode '"$GITHUB_RUN_NUMBER"'/' app/build.gradle
          # Ejemplo: Version name basada en el número de ejecución
          sed -i 's/versionName "[^"]*"/versionName "1.0.'"$GITHUB_RUN_NUMBER"'"/' app/build.gradle
          
          echo "NEW_VERSION=1.0.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push

      - name: Create and Push Tag
        run: |
          git tag v${{ env.NEW_VERSION }}
          git push origin v${{ env.NEW_VERSION }}